
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050002">

<title>RAVAN REAL VIP 👑</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:
    radial-gradient(circle at 50% 35%,#35000d 0%,#0b0004 42%,#000 100%);
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

/* BACKGROUND GLOW */
body::before{
  content:"";
  position:fixed;
  width:500px;
  height:500px;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(
    circle,
    rgba(255,0,55,.18),
    transparent 68%
  );
  pointer-events:none;
}

/* MAIN CARD */
.card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:410px;
  padding:40px 22px 28px;
  text-align:center;
  background:
    linear-gradient(
      180deg,
      rgba(25,0,7,.98),
      rgba(3,0,2,.99)
    );
  border:1px solid rgba(255,23,68,.4);
  border-radius:30px;

  box-shadow:
    0 0 20px rgba(255,0,50,.25),
    0 0 70px rgba(255,0,50,.12),
    0 30px 80px rgba(0,0,0,.9);
}

/* AVATAR */
.avatar{
  position:relative;
  width:150px;
  height:150px;
  margin:0 auto 30px;
  padding:6px;
  border-radius:50%;

  background:conic-gradient(
    #fff,
    #ff1744,
    #730015,
    #ff1744,
    #fff
  );

  box-shadow:
    0 0 20px #ff1744,
    0 0 45px rgba(255,23,68,.65);

  animation:avatarGlow 2.5s ease-in-out infinite;
}

.avatar::before{
  content:"";
  position:absolute;
  inset:-12px;
  border:1px dashed rgba(255,23,68,.7);
  border-radius:50%;
  animation:spin 8s linear infinite;
}

.avatar img{
  position:relative;
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  border-radius:50%;
  border:5px solid #000;
}

@keyframes avatarGlow{
  0%,100%{
    transform:scale(1);
    box-shadow:
      0 0 18px #ff1744,
      0 0 38px rgba(255,23,68,.45);
  }

  50%{
    transform:scale(1.035);
    box-shadow:
      0 0 30px #ff1744,
      0 0 65px rgba(255,23,68,.75);
  }
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* TITLE */
h1{
  margin-bottom:30px;
  font-size:28px;
  line-height:1.25;
  font-weight:900;
  letter-spacing:.3px;

  background:linear-gradient(
    90deg,
    #fff,
    #ff1744,
    #fff,
    #ff1744,
    #fff
  );

  background-size:250% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;

  animation:titleShine 4s linear infinite;
}

@keyframes titleShine{
  from{
    background-position:100%;
  }

  to{
    background-position:-150%;
  }
}

/* SMALL TEXT */
.subtitle{
  margin-top:-18px;
  margin-bottom:25px;
  font-size:11px;
  line-height:1.6;
  color:rgba(255,255,255,.65);
}

/* BUTTON */
.join{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;

  width:100%;
  min-height:62px;
  padding:17px 20px;

  border-radius:18px;

  background:linear-gradient(
    110deg,
    #8d001c,
    #ff1744,
    #ff6380,
    #ff1744,
    #8d001c
  );

  background-size:250% 100%;

  color:#fff;
  text-decoration:none;

  font-size:16px;
  font-weight:900;
  letter-spacing:1px;

  box-shadow:
    0 0 18px rgba(255,23,68,.7),
    0 0 45px rgba(255,23,68,.3);

  animation:buttonGlow 2.5s ease-in-out infinite;

  transition:transform .2s ease;
}

.join:hover{
  transform:translateY(-3px) scale(1.02);
}

.join:active{
  transform:scale(.96);
}

@keyframes buttonGlow{
  0%,100%{
    background-position:0% 50%;
    box-shadow:
      0 0 18px rgba(255,23,68,.7),
      0 0 40px rgba(255,23,68,.25);
  }

  50%{
    background-position:100% 50%;
    box-shadow:
      0 0 30px rgba(255,23,68,1),
      0 0 65px rgba(255,23,68,.5);
  }
}

.telegram{
  font-size:22px;
}

.arrow{
  font-size:27px;
  line-height:1;
}

/* FOOTER */
footer{
  margin-top:23px;
  font-size:10px;
  letter-spacing:2px;
  color:rgba(255,255,255,.5);
}

footer strong{
  color:#fff;
  text-shadow:
    0 0 8px #ff1744,
    0 0 15px rgba(255,23,68,.7);
}

.sep{
  margin:0 7px;
  color:#ff1744;
}

/* MOBILE */
@media(max-width:420px){

  body{
    padding:14px;
  }

  .card{
    padding:34px 17px 26px;
    border-radius:25px;
  }

  .avatar{
    width:132px;
    height:132px;
    margin-bottom:27px;
  }

  h1{
    font-size:24px;
  }

  .join{
    min-height:58px;
    font-size:15px;
  }
}

/* ACCESSIBILITY */
.join:focus-visible{
  outline:3px solid #fff;
  outline-offset:5px;
}

/* REDUCED MOTION */
@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>

  <!-- TITLE -->
  <h1>

  </h1>

  <div class="subtitle">
    Exclusive VIP Community
    <br>

  </div>

  <!-- TELEGRAM BUTTON -->
  <a

  <footer>

  </footer>

</main>

</body>
